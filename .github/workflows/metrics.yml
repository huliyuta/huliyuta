name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # updates every day
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate languages chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/languages.py metrics.languages.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.languages.svg
          git diff --cached --quiet || (git commit -m "Update languages chart" && git push)
